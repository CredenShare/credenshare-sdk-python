name: Release

# Tag-triggered. Nothing here fires on a push to a branch: publishing to PyPI is
# irreversible — a version number can be yanked but never reused — so it takes the
# deliberate act of tagging.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify before anything is published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
      # Same opt-in variable the CI workflow uses. Without it here, a release - the one
      # build that cannot be taken back - is the only one that never checks the fixture
      # against the canonical copy, even on a repository where the check is configured.
      - run: pytest -q
        env:
          CREDENSHARE_VECTORS_URL: ${{ vars.CREDENSHARE_VECTORS_URL }}
      - run: python -m credenshare.conformance -v

      - name: The tag must match the version in pyproject.toml
        # A mismatch produces a release that says one thing on GitHub and another on PyPI,
        # and the version is how anyone reports which code they were running.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match pyproject version $VERSION"
            exit 1
          fi
          echo "releasing $VERSION"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: The wheel must carry the vectors and pass its own self-check
        # The last chance to catch a packaging mistake that dropped the fixture. Without
        # this, a wheel can be published whose `python -m credenshare.conformance` fails for
        # every user while the repository's own CI was green.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          cd /tmp && /tmp/verify/bin/python -m credenshare.conformance

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI mints a short-lived token for this workflow on this
    # repository, so there is no long-lived API token in the repository's secrets to leak or
    # rotate. `id-token: write` is what allows the OIDC exchange.
    permissions:
      # gh release create needs this
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/credenshare
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: vars.PUBLISH_TO_REGISTRY == 'true'

      - name: Registry publication is not switched on
        if: vars.PUBLISH_TO_REGISTRY != 'true'
        run: |
          echo "::notice title=Not published to the registry::This release was verified and \
          tagged, but PUBLISH_TO_REGISTRY is not 'true' so nothing was uploaded. Configure the \
          registry credential for this repository, then set the repository variable \
          PUBLISH_TO_REGISTRY=true. See VERSIONING.md."

      # A GitHub Release is the durable, registry-independent artifact: it exists whether or
      # not PUBLISH_TO_REGISTRY is on, so a tag always produces something a consumer can
      # point at and something this repository can be verified against later.
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repository out - it only downloads the built dist - so
          # gh has no git remote to infer the repo from and exits 1. The other three happen to
          # check out for their own reasons and did not hit it.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME"             --title "$GITHUB_REF_NAME"             --notes "Install:

          \`\`\`
          pip install "git+https://github.com/CredenShare/credenshare-sdk-python@$GITHUB_REF_NAME"
          \`\`\`

          Verify the install against the wire specification:

          \`\`\`
          python -m credenshare.conformance
          \`\`\`

          See CHANGELOG.md for what changed.

          Not on PyPI yet - see VERSIONING.md."
